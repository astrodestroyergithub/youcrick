<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <!-- Signature YouCrick Emerald Stadium Gradient -->
    <linearGradient id="ycBg" x1="6" y1="4" x2="58" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="45%" stop-color="#009270" />
      <stop offset="100%" stop-color="#054a37" />
    </linearGradient>

    <!-- Championship Gold Bat Blade Gradient -->
    <linearGradient id="ycBat" x1="16" y1="48" x2="48" y2="16" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#fef08a" />
    </linearGradient>

    <!-- Crimson Cricket Ball Gradient -->
    <radialGradient id="ycBall" cx="38%" cy="32%" r="65%">
      <stop offset="0%" stop-color="#ff6b6b" />
      <stop offset="55%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#991b1b" />
    </radialGradient>

    <!-- Subtle Drop Shadow for High-Contrast Tab Visibility -->
    <filter id="ycShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.5" flood-color="#022c22" flood-opacity="0.55" />
    </filter>
  </defs>

  <!-- Rounded Squircle App Badge Base -->
  <rect x="3" y="3" width="58" height="58" rx="15" fill="url(#ycBg)" stroke="#34d399" stroke-width="1.5" stroke-opacity="0.45" />

  <!-- Subtle Inner Stadium Boundary Ring -->
  <circle cx="32" cy="32" r="22" stroke="#ffffff" stroke-width="1.2" stroke-opacity="0.14" stroke-dasharray="3 3" />

  <!-- Dynamic Shot Trajectory Arc -->
  <path d="M14 44 C 19 23, 33 14, 51 15" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round" opacity="0.85" />

  <!-- Iconic Diagonal Cricket Bat (Rotated -45 deg around center) -->
  <g filter="url(#ycShadow)" transform="rotate(-45 32 32)">
    <!-- Bat Handle Grip (White & Slate Stripes) -->
    <rect x="29.5" y="7" width="5" height="14" rx="2.5" fill="#f8fafc" />
    <path d="M29.5 11 H34.5 M29.5 14.5 H34.5 M29.5 18 H34.5" stroke="#0f172a" stroke-width="1.2" opacity="0.45" />

    <!-- Bat Blade -->
    <path d="M26 21 C26 19.5 38 19.5 38 21 L39 51 C39 54 25 54 25 51 Z" fill="url(#ycBat)" />

    <!-- Bat Spine Ridge Highlight -->
    <path d="M32 21 V52" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round" opacity="0.55" />
  </g>

  <!-- Crimson Cricket Ball at the Sweet Spot -->
  <g filter="url(#ycShadow)">
    <circle cx="41" cy="25" r="10.5" fill="url(#ycBall)" stroke="#ffffff" stroke-width="1.2" stroke-opacity="0.35" />
    <!-- Classic Stitched Seam -->
    <path d="M34.5 18.5 C 39.5 21.5, 42.5 24.5, 47.5 31.5" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="2.2 2" />
    <!-- Specular Shine Dot -->
    <circle cx="37.5" cy="21.5" r="2" fill="#ffffff" opacity="0.55" />
  </g>
</svg>